  dense_weight: 0.6             # Dense 비율 (BM25 비율 = 1 - dense_weight)
  candidate_k: 50               # Dense·BM25 각각에서 뽑는 후보 수

rewrite:
  model: gpt-5-mini
  max_tokens: 2048              # 질문 재작성의 출력·추론 토큰 한도
  reasoning_effort: low
  usd_per_1m_tokens: [0.25, 0.025, 2.00]

# ── ③ 검증 (03_validation) ──
validation:
  golden_sets: [eval/golden_set.jsonl, eval/eval_questions.yaml]   # 직접 만든 질문·정답·핵심 사실
  qa_per_doc: 15                # 문서당 QA 를 만들 청크 수 (gpt 호출 수 = 문서 수 × 이 값)
  qa_min_chunk_chars: 250       # 이보다 짧은 청크로는 QA 를 만들지 않음
  qa_workers: 4                 # 동시에 보내는 QA 생성 요청 수
  qa_max_tokens: 3000
  qa_reasoning_effort: low
  min_keywords: 2               # 근거 청크에 실제로 있는 근거 키워드가 이 개수 미만인 QA 는 제외
  max_keywords: 8               # QA 당 근거 키워드 최대 개수
  split_ratio: [0.7, 0.15, 0.15]  # train / valid / test — 평가에는 test 만 사용
  seed: 42
  max_qa: 30                    # 평가 데이터셋에 넣는 test QA 최대 개수

# ── ④ 생성 (04_generation) ──
llm:
  model: gpt-5-mini
  max_tokens: 2048              # max_completion_tokens (reasoning 토큰 포함!)
  reasoning_effort: low         # minimal | low | medium | high
  usd_per_1m_tokens: [0.25, 0.025, 2.00]  # 입력 · 캐시 입력 · 출력 단가 (USD / 100만 토큰)

# ── ⑤ 평가 (05_evaluation) ──
evaluation:
  judge_model: gpt-5-mini       # RAGAS 심판 LLM
  judge_reasoning_effort: low
  judge_max_tokens: 4096
  judge_usd_per_1m_tokens: [0.25, 0.025, 2.00]
