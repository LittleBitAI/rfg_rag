# ============================================================
#  RFP RAG 설정 — 다섯 노트북(01 전처리 → 02 검색 → 03 검증 → 04 생성 → 05 평가)이 읽습니다.
#  노트북 사이에 주고받는 파일은 모두 artifacts/ 아래에 저장됩니다.
# ============================================================
paths:
  org_csv: data/data_list.csv   # 담당자가 제공한 파일명 · 발주 기관 목록 (필수)
  input: data/rfp.zip           # ZIP 파일 또는 폴더 (PDF / HWP / HWPX)
  ocr_captions: data/ocr_captions.jsonl  # 유형별 벤치마크 승자의 저장된 OCR 결과

# ── ① 전처리 (01_preprocessing) ──
parsing:
  skip_first_pages: 2           # PDF 앞 N쪽(표지·목차)은 청크에서 제외. 0 이면 HWP 표지·목차 자동 감지도 끔
  repeated_line_ratio: 0.5      # 이 비율 이상 쪽에 반복되는 짧은 줄 = 머리글/바닥글 → 제거
  table_dedupe_threshold: 0.85  # 줄의 토큰 중 표 셀 토큰 비율이 이 이상이면 본문에 섞인 표 줄로 보고 제거
  join_min_line_len: 20         # PDF 줄바꿈으로 끊긴 문장 잇기 — 이보다 짧은 줄(제목 등)은 잇지 않음
  hanja_mode: append            # none | append(必(필)) | replace(필)
  max_repeat_image_pages: 3     # (OCR) 이 횟수 이상 반복 등장하는 그림 = 로고/장식 → OCR 하지 않음

  craft:
    enabled: false             # 기존 Vision 경로 유지; 켜면 후보만 Vision으로 전달
    model_dir: models/easyocr   # 로컬 craft_mlt_25k.pth; 다운로드 금지
    cache_dir: artifacts/ocr_detector
    review_queue: artifacts/ocr_review.jsonl

ocr:
  model: gpt-5-mini
  max_tokens: 2048
  reasoning_effort: low
  usd_per_1m_tokens: [0.25, 0.025, 2.00]  # 입력 · 캐시 입력 · 출력 단가 (USD / 100만 토큰)

ocr_benchmark:
  # https://developers.openai.com/api/docs/pricing — 2026-10-16, Standard, short context
  gpt-6-luna:
    usd_per_1m_tokens: [0.10, 0.01, 0.50]
  # https://ai.google.dev/gemini-api/docs/pricing#gemini-3.5-flash-lite — 2026-10-16, Standard
  gemini-3.5-flash-lite:
    usd_per_1m_tokens: [0.30, 0.03, 2.50]

chunking:
  chunk_size: 700               # 글자 단위
  overlap_ratio: 0.2            # 겹침 = chunk_size × overlap_ratio
  table_size_factor: 2.0        # 표 청크는 chunk_size × 이 배수까지 허용(행 단위 분할, 헤더 반복)
  min_chunk_chars: 30

# ── ② 검색 (02_retrieval) ──
embedding:
  model: nlpai-lab/KURE-v1      # 한국어 검색 특화(bge-m3 기반)
  batch_size: 32
  max_seq_length: 2048

bm25:
  k1: 1.5
  b: 0.75

retrieval:
  field_similarity: 0.66        # 수량 필드 후보의 코사인 유사도 임계값; 실측 근거는 로컬에 보관
  filter_token_budget: 16000    # 수량 필터의 모든 일치 문서에 균등 배분
  token_budget: 2500           # 검색 결과 본문 토큰 예산 (임베딩 토크나이저 기준)
  fusion: rrf                   # Dense · BM25 합치기 — rrf = 순위 역수 합 Σ 1/(60 + 순위) | minmax = 정규화 점수 가중합
  dense_weight: 0.6             # fusion: minmax 일 때 Dense 비율 (BM25 비율 = 1 - dense_weight)
  candidate_k: 50               # Dense·BM25 각각에서 뽑는 후보 수
  rerank:                       # 로컬 크로스 인코더로 후보 순서를 다시 매김 (GPU, API 비용 없음)
    enabled: false              # true 면 처음 실행 때 모델(약 2.3GB)을 받고, 순위가 리랭커 순서가 된다
    model: dragonkue/bge-reranker-v2-m3-ko   # bge-reranker-v2-m3 를 한국어로 추가 학습 (약 0.6B)
    top_n: 30                   # 하이브리드 상위 후보 중 다시 매겨 컨텍스트에 담을 개수 (나머지는 평가 스냅샷에만 남는다)
    batch_size: 16
    max_length: 1024            # 질문 + 청크 토큰 상한 (넘는 부분은 잘라서 점수 매김)

rewrite:
  model: gpt-6-luna
  max_tokens: 2048              # 질문 재작성의 출력·추론 토큰 한도
  reasoning_effort: low
  usd_per_1m_tokens: [0.10, 0.01, 0.50]

# ── ③ 검증 (03_validation) ──
validation:
  # 평가셋은 골든 dev + RFP 질문만 사용. test는 03의 근거 라벨 품질 보고서에서만 읽음
  golden_sets: [eval/golden/dev.jsonl, eval/eval_questions.yaml]

# ── ④ 생성 (04_generation) ──
llm:
  model: gpt-6-luna
  max_tokens: 8192              # 전체 사업 표와 추론 토큰을 함께 담는 max_completion_tokens
  reasoning_effort: low         # minimal | low | medium | high
  usd_per_1m_tokens: [0.10, 0.01, 0.50]  # Input, cached input, output: USD per million tokens.

# ── ⑤ 평가 (05_evaluation) ──
evaluation:
  judge: ragas                  # faithfulness · factual_correctness 심판 — ragas = RAGAS + gpt (유료) | local = 로컬 리랭커 (API 0원)
  judge_model: gpt-5-mini       # RAGAS 심판 LLM (judge: ragas 일 때만)
  judge_reasoning_effort: low
  judge_max_tokens: 4096
  judge_usd_per_1m_tokens: [0.25, 0.025, 2.00]
